[build-system]
requires = ["scikit-build-core>=0.10", "libclang>=18"]
build-backend = "scikit_build_core.build"

[project]
name = "cvk"
version = "0.1.0"
description = "Generated Python bindings for CVK's compositional Vulkan API"
readme = "python/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.scikit-build]
wheel.packages = []
wheel.py-api = "py3"
build.targets = ["cvk-python"]
install.components = ["python"]
sdist.include = ["external/Vulkan-Headers/**", "external/Vulkan-Utility-Libraries/**", "external/volk/**"]

[tool.scikit-build.cmake.define]
CVK_BUILD_PYTHON = "ON"
CVK_BUILD_EXAMPLES = "OFF"
CVK_PLATFORMS = ""
